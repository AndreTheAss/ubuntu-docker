version: "3.8"

services:
  apache-php:
    build:
      context: .
    container_name: apache-php
    ports:
      - "81:80"
    environment:
      WORDPRESS_DB_HOST: mariadb:3306
      WORDPRESS_DB_NAME: rolandrauten
      WORDPRESS_DB_USER: andre
      WORDPRESS_DB_PASSWORD: Anfdre212Anfdre212
    volumes:
      - www_data:/var/www/html
    depends_on:
      - mariadb
    networks:
      - npm_default
    restart: always

  mariadb:
    image: mariadb:10.11
    container_name: mariadb
    environment:
      MYSQL_ROOT_PASSWORD: Anfdre212Anfdre212
      MYSQL_DATABASE: rolandrauten
      MYSQL_USER: andre
      MYSQL_PASSWORD: Anfdre212Anfdre212
    command: --max_allowed_packet=512M --innodb-log-file-size=256M
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - npm_default
    restart: always

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
    ports:
      - "8080:80"
    depends_on:
      - mariadb
    networks:
      - npm_default
    restart: always

  ftp:
    image: fauria/vsftpd
    container_name: ftp
    restart: always
    ports:
      - "2222:21"                   # EXTERN 2222 → INTERN 21
      - "21000-21010:21000-21010"  # Passive Ports (falls du die ändern willst, sag Bescheid)
    environment:
      FTP_USER: "andre"
      FTP_PASS: "Anfdre212Anfdre212"
      PASV_ADDRESS: "0.0.0.0"
      PASV_MIN_PORT: 21000
      PASV_MAX_PORT: 21010
      LOCAL_UMASK: 022
      FILE_OPEN_MODE: 0666
      CHOWN_UPLOADS: "YES"
      CHOWN_UPLOADS_USERNAME: "www-data"
      LOG_STDOUT: "YES"
    volumes:
      - www_data:/home/vsftpd/andre
    networks:
      - npm_default


  fix-permissions:
    image: alpine:latest
    container_name: fix-permissions
    command: sh -c "chown -R 1000:1000 /var/www/html; find /var/www/html -type d -exec chmod 775 {} \;; find /var/www/html -type f -exec chmod 664 {} \;"
    volumes:
      - www_data:/var/www/html
    restart: "no"

volumes:
  www_data:
  db_data:

networks:
  npm_default:
    external: true
